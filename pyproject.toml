[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-toolkit"
version = "0.1.0"
description = "Sovereign Multi-Agent AI Development Framework and SDLC Operating System for Google Antigravity (AGY)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AGYToolkit Contributors" }
]
keywords = [
    "antigravity",
    "multi-agent",
    "sdlc",
    "governance",
    "developer-tools",
    "ai-agents",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
agy-toolkit = "agy_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["automation/src"]

spring:
  application:
    name: {{PROJECT_NAME}}
  datasource:
    url: jdbc:h2:mem:{{PACKAGE_NAME}}db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

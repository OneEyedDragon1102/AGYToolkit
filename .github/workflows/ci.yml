name: AGYToolkit CI & Governance Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-govern:
    name: Test & Governance Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run Test Suite with Coverage
        run: |
          pytest automation/tests --cov=agy_toolkit --cov-report=term-missing --cov-fail-under=50

      - name: Run AGYToolkit Doctor Diagnostic
        run: |
          agy-toolkit doctor

      - name: Anti-Bloat Code Hygiene Verification
        run: |
          python -c "import pathlib, sys; src = pathlib.Path('automation/src'); oversized = [f'{p} ({len(p.read_text(encoding=\"utf-8\").splitlines())} lines)' for p in src.rglob('*.py') if len(p.read_text(encoding=\"utf-8\").splitlines()) > 600]; (print('Error: Monolithic files detected:\n' + '\n'.join(oversized)) or sys.exit(1)) if oversized else print('Anti-bloat size audit passed: 0 monolithic files.')"
